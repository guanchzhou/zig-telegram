name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"
  ZIG_LINUX_X86_64_SHA256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"

jobs:
  build:
    name: Build GitHub Pages + Zig Autodoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig 0.17.0 (SHA-256 verified)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-0.17.0.tar.xz"
          curl -fsSL "$URL" -o zig.tar.xz
          echo "${ZIG_LINUX_X86_64_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Generate documentation bundle (zig build docs)
        run: |
          zig build docs
          touch zig-out/docs/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
